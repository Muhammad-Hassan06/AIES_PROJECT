services:
  - type: web
    name: cybershield-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GROQ_API_KEY
        sync: false
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: SAFE_FETCH_ENABLED
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./data/cybershield.db
